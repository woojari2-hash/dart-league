<html lang="ko">
<head>

  <link id="appleTouchIconLink" rel="apple-touch-icon" sizes="512x512" href="" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #090d16;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .font-score {
      font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
      font-variant-numeric: tabular-nums;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .board-card {
      transition: all 0.18s ease;
    }
    .board-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
    }

    @keyframes pulseWin {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.45); }
      50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    }
    .win-glow {
      animation: pulseWin 2s infinite;
    }

    @keyframes shoutPopIn {
      0% { transform: scale(0.2) rotate(-8deg); opacity: 0; }
      55% { transform: scale(1.1) rotate(2deg); opacity: 1; }
      75% { transform: scale(0.96) rotate(-1deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes shoutGlowPulse {
      0%, 100% { filter: drop-shadow(0 0 25px rgba(251, 191, 36, 0.85)); }
      50% { filter: drop-shadow(0 0 55px rgba(244, 63, 94, 0.95)); }
    }
    @keyframes ringExpand {
      0% { transform: scale(0.4); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .animate-shout-box {
      animation: shoutPopIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards, shoutGlowPulse 1.1s infinite ease-in-out;
    }
    .animate-ring-wave {
      animation: ringExpand 1.4s ease-out infinite;
    }

    body.scoreboard-only #topHeader,
    body.scoreboard-only #bottomFooter {
      display: none !important;
    }
    body.scoreboard-only #mainWorkspace {
      min-height: 100vh !important;
      padding: 0.55rem !important;
    }
    body.scoreboard-only #floatingFocusControls {
      display: flex !important;
    }

    .score-number {
      font-size: 2.2rem;
      line-height: 1.05;
    }
    @media (min-width: 1280px) {
      .score-number {
        font-size: 2.7rem;
      }
    }

    body.single-match-view .board-main-title {
      font-size: 1.45rem !important;
    }
    body.single-match-view .board-round-pill {
      font-size: 0.92rem !important;
      padding: 0.25rem 0.65rem !important;
    }
    body.single-match-view .score-number {
      font-size: 3.3rem !important;
    }
    body.single-match-view .score-colon {
      font-size: 2.35rem !important;
    }
    body.single-match-view .team-label {
      font-size: 1.25rem !important;
    }
    body.single-match-view .player-pill {
      padding-top: 0.48rem !important;
      padding-bottom: 0.48rem !important;
      padding-left: 0.65rem !important;
      padding-right: 0.65rem !important;
      font-size: 0.96rem !important;
    }
    body.single-match-view .player-pts {
      font-size: 0.92rem !important;
    }
    body.single-match-view .live-log-row {
      font-size: 0.9rem !important;
      padding-top: 0.32rem !important;
      padding-bottom: 0.32rem !important;
    }
    @media (min-width: 1536px) {
      body.single-match-view .board-main-title {
        font-size: 1.7rem !important;
      }
      body.single-match-view .score-number {
        font-size: 4.1rem !important;
      }
      body.single-match-view .player-pill {
        font-size: 1.08rem !important;
      }
    }

    #qrCodeContainer img,
    #qrCodeContainer canvas {
      margin: 0 auto;
      display: block;
    }
  </style>
</head>
